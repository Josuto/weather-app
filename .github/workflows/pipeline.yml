name: Vercel Production Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main

permissions:
  contents: write
  
jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Validate code
    steps:
      - name: Code Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup PNPM 🕸️
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 🕸️
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies 💾
        run: pnpm install

      - name: Run tests 🚦
        run: pnpm test --ci --reporters=default --reporters=jest-junit --coverage --watchAll=false

      - name: Generate test results badge 🥇
        run: |
          if [ -f ./test-results/junit.xml ]; then
            report=./test-results/junit.xml
          elif [ -f ./junit.xml ]; then
            report=./junit.xml
          else
            echo "JUnit report not found; writing unknown badge."
            mkdir -p ./badges
            curl -s -o ./badges/badge-test-results.svg "https://img.shields.io/badge/tests-unknown-orange.svg"
            exit 0
          fi
          all_tests=$(grep -oP 'tests="\K\d+' "$report" | head -1 || echo "0")
          failed=$(grep -oP 'failures="\K\d+' "$report" | head -1 || echo "0")
          if [ -z "$all_tests" ] || [ -z "$failed" ]; then
            all_tests=0
            failed=0
          fi
          passed=$((all_tests - failed))
          if [ "$failed" -eq 0 ]; then
            result="success"
          else
            result="red"
          fi
          mkdir -p ./badges
          curl -s -o ./badges/badge-test-results.svg "https://img.shields.io/badge/tests-${passed}%20passed,%20${failed}%20failed-${result}.svg"

      - name: Generate test coverage badge 🥈
        run: |
          export PATH="$PATH:$(pwd)/node_modules/.bin"
          cat ./coverage/lcov.info | coverbadge -o ./badges/badge-test-coverage.svg

      - name: Commit generated badges ⬆️
        run: |
          git config --global user.name 'Automated CI'
          git config --global user.email '6097850+Josuto@users.noreply.github.com'
          git add .
          git diff-index --quiet HEAD || git commit -m "Updated test badges [skip ci]"
          git push origin main --no-verify

  deploy:
    needs: [run-tests]
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
    steps:
      - name: Code Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup PNPM 🕸️
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 🕸️
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      
      - name: Install dependencies 💾
        run: pnpm install

      - name: Install Vercel CLI 💾
        run: pnpm add --global vercel@latest

      - name: Pull Vercel Environment Information ⬇️
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts 🔧
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel ⬆️
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
